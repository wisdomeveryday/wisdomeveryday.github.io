<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisdom Everyday — картки мудрості для друку</title>
<meta name="description" content="Картки мудрості для друку 10×15 см: JPG + PDF, 300 dpi. 6 мов.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c140d">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
<header class="top">
  <div class="wrap top-in">
    <a class="logo" id="logoLink" href="index.html">
      <img src="assets/icon-192.png" alt="" width="38" height="38">
      <span><b>Wisdom Everyday</b><small id="brandSub"></small></span>
    </a>
    <nav class="menu" id="menu"></nav>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </div>
</header>
<main>
  <section class="hero">
    <div class="wrap hero-in">
      <div class="hero-txt">
        <p class="kicker" id="kicker"></p>
        <h1 id="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>
        <a class="btn btn-big" id="heroBtn" href="catalog.html"></a>
        <ul class="meta" id="heroMeta"></ul>
      </div>
      <div class="fan" id="fan"></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 class="h2" id="topTitle"></h2>
      <p class="sub center" id="topSub"></p>
      <div class="tops" id="tops"></div>
    </div>
  </section>

  <section class="sec sec-alt">
    <div class="wrap">
      <h2 class="h2" id="useTitle"></h2>
      <div class="uses" id="uses"></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 class="h2" id="howTitle"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="sec sec-alt">
    <div class="wrap">
      <h2 class="h2" id="printTitle"></h2>
      <div class="specs" id="specs"></div>
      <div class="print2" id="print2"></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 class="h2" id="catsTitle"></h2>
      <div class="cat-tiles" id="catTiles"></div>
      <p class="center"><a class="btn btn-big" id="catsBtn" href="catalog.html"></a></p>
    </div>
  </section>

  <section class="sec sec-alt">
    <div class="wrap narrow">
      <h2 class="h2" id="faqTitle"></h2>
      <div class="faq" id="faq"></div>
    </div>
  </section>
</main>
<footer class="foot">
  <div class="wrap">
    <p id="follow"></p>
    <p id="contact"></p>
    <p class="muted" id="rights"></p>
  </div>
</footer>

<div class="bar" id="bar" hidden>
  <div class="wrap bar-in">
    <div class="bar-txt"><b id="barCount"></b><span id="barSub"></span></div>
    <button class="btn" id="barBtn"></button>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg-close"><button aria-label="close">×</button></form>
  <div id="dlgBody"></div>
</dialog>

<script src="config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/texts.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
