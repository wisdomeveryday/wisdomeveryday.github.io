<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог карток — Wisdom Everyday</title>
<meta name="description" content="Картки мудрості для друку 10×15 см: JPG + PDF, 300 dpi. 6 мов.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c140d">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="catalog">
<header class="top">
  <div class="wrap top-in">
    <a class="logo" id="logoLink" href="index.html">
      <img src="assets/icon-192.png" alt="" width="38" height="38">
      <span><b>Wisdom Everyday</b><small id="brandSub"></small></span>
    </a>
    <nav class="menu" id="menu"></nav>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </div>
</header>
<main>
  <section class="hero hero-small">
    <div class="wrap cat-head">
      <h1 id="catTitle"></h1>
      <p id="catLead"></p>
    </div>
  </section>
  <nav class="cats" id="cats"></nav>
  <section class="wrap">
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer class="foot">
  <div class="wrap">
    <p id="follow"></p>
    <p id="contact"></p>
    <p class="muted" id="rights"></p>
  </div>
</footer>

<div class="bar" id="bar" hidden>
  <div class="wrap bar-in">
    <div class="bar-txt"><b id="barCount"></b><span id="barSub"></span></div>
    <button class="btn" id="barBtn"></button>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg-close"><button aria-label="close">×</button></form>
  <div id="dlgBody"></div>
</dialog>

<script src="config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/texts.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
