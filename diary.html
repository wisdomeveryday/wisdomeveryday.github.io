<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Щоденник мудрості — Wisdom Everyday</title>
<meta name="description" content="Щоденник мудрості на 30 днів: PDF для друку і для планшета, без дат.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c140d">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="diary">
<header class="top">
  <div class="wrap top-in">
    <a class="logo" id="logoLink" href="index.html">
      <img src="assets/icon-192.png" alt="" width="38" height="38">
      <span><b>Wisdom Everyday</b><small id="brandSub"></small></span>
    </a>
    <nav class="menu" id="menu"></nav>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </div>
</header>
<main>
  <section class="hero">
    <div class="wrap hero-in">
      <div class="hero-txt">
        <p class="kicker" id="kicker"></p>
        <h1 id="dTitle"></h1>
        <p class="hero-sub" id="dLead"></p>
        <p class="d-price" id="dPrice"></p>
        <button class="btn btn-big" id="dBuy"></button>
        <ul class="meta" id="dMeta"></ul>
      </div>
      <div class="fan fan-diary" id="dFan"></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 class="h2" id="dPageTitle"></h2>
      <div class="d-page">
        <img id="dPageImg" alt="" loading="lazy" width="745" height="1054">
        <ol class="d-parts" id="dParts"></ol>
      </div>
    </div>
  </section>

  <section class="sec sec-alt">
    <div class="wrap">
      <h2 class="h2" id="dVerTitle"></h2>
      <div class="d-vers" id="dVers"></div>
      <div class="specs" id="dSpecs"></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <h2 class="h2" id="dPaperTitle"></h2>
      <ol class="steps steps3" id="dPaper"></ol>
      <p class="center d-again"><button class="btn btn-big" id="dBuy2"></button></p>
    </div>
  </section>
</main>
<footer class="foot">
  <div class="wrap">
    <p id="follow"></p>
    <p id="contact"></p>
    <p class="muted" id="rights"></p>
  </div>
</footer>

<div class="bar" id="bar" hidden>
  <div class="wrap bar-in">
    <div class="bar-txt"><b id="barCount"></b><span id="barSub"></span></div>
    <button class="btn" id="barBtn"></button>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg-close"><button aria-label="close">×</button></form>
  <div id="dlgBody"></div>
</dialog>

<script src="config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/texts.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
